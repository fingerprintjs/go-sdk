name: Functional tests

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  set_datadog_team:
    name: 'Set Datadog team'
    uses: fingerprintjs/dx-team-toolkit/.github/workflows/set-datadog-team.yml@v1
    secrets:
      DD_API_KEY: ${{ secrets.INTEGRATIONS_DATADOG_API_KEY }}

  tests:
    name: Functional tests (GO ${{ matrix.go-version }})
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23', '1.24', '1.25', '1.26']

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: functional_test/go.sum
      - name: Run functional tests
        run: go test
        working-directory: functional_test
        env:
          FINGERPRINT_API_KEY: ${{ secrets.FINGERPRINT_API_KEY }}

  # Builds against the latest released SDK. A compile failure here can mean a feature
  # merged but hasn't shipped yet, rather than a regression in the published package.
  tests-against-released-sdk:
    name: 'Functional tests (released SDK)'
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: functional_test/go.sum

      - name: Bump SDK to latest release
        run: go get github.com/fingerprintjs/go-sdk/v8@latest
        working-directory: functional_test
        env:
          GOWORK: "off"

      - name: Print resolved SDK version
        run: go list -m github.com/fingerprintjs/go-sdk/v8
        working-directory: functional_test
        env:
          GOWORK: "off"

      - name: Run functional tests against released SDK
        run: go test
        working-directory: functional_test
        env:
          GOWORK: "off"
          FINGERPRINT_API_KEY: ${{ secrets.FINGERPRINT_API_KEY }}
